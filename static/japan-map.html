<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>日本景点地图</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""><style>
html,body,#map{width:100%;height:100%;margin:0;background:#e8eef2}.leaflet-control-attribution{font-size:10px}.spot-marker{background:transparent;border:0}.spot-pin{width:34px;height:34px;border-radius:50% 50% 50% 0;background:#687785;border:2px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.35);transform:rotate(-45deg)}.spot-pin.selected{background:#c0392b}.spot-pin.user{background:#3d7a57}.spot-pin span{display:block;color:#fff;font:bold 13px/34px Arial;text-align:center;transform:rotate(45deg)}.map-notice{position:fixed;z-index:1000;top:9px;left:50%;transform:translateX(-50%);padding:5px 10px;border-radius:14px;background:rgba(44,62,80,.88);color:#fff;font:12px sans-serif;white-space:nowrap;pointer-events:none}.popup-title{font-weight:700;color:#2c3e50;margin-bottom:4px}.popup-state{color:#c0392b;font-size:12px}.spot-label{background:rgba(255,255,255,.94);border:1px solid #d8cfc6;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.18);color:#3a3a3a;font:bold 11px sans-serif;padding:2px 5px;white-space:nowrap}.leaflet-tooltip-bottom.spot-label:before{border-bottom-color:#d8cfc6}
</style></head><body><div id="map"></div><div class="map-notice">拖动浏览日本 · 双指/滚轮缩放 · 点击标记查看景点</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script>(function(){var japanBounds=L.latLngBounds([24,122],[46.8,154.5]),map=L.map('map',{maxBounds:japanBounds,maxBoundsViscosity:1,minZoom:5,maxZoom:18,zoomControl:true}).setView([36.2,138.3],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);var spots=[];try{spots=JSON.parse(new URLSearchParams(location.search).get('spots')||'[]')}catch(e){}var markerBounds=[];spots.forEach(function(spot){if(spot.lat===null||spot.lng===null||spot.lat===''||spot.lng===''||!isFinite(spot.lat)||!isFinite(spot.lng))return;var name=String(spot.name||'未命名景点'),firstChar=Array.from(name.trim())[0]||'●',type=spot.checked?'selected':(spot.isPreset===false?'user':''),icon=L.divIcon({className:'spot-marker',html:'<div class="spot-pin '+type+'"><span>'+escapeHtml(firstChar)+'</span></div>',iconSize:[36,36],iconAnchor:[18,36],popupAnchor:[0,-35]}),state=spot.checked?'已选景点':(spot.isPreset===false?'我的添加':'预设景点'),marker=L.marker([Number(spot.lat),Number(spot.lng)],{icon:icon}).addTo(map);marker.bindPopup('<div class="popup-title">'+escapeHtml(name)+'</div><div class="popup-state">'+state+'</div>');marker.bindTooltip(escapeHtml(name),{permanent:true,direction:'bottom',offset:[0,14],className:'spot-label',opacity:.96});markerBounds.push([Number(spot.lat),Number(spot.lng)])});if(markerBounds.length)map.fitBounds(markerBounds,{padding:[35,35],maxZoom:11});function escapeHtml(value){return String(value).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}})();</script></body></html>
