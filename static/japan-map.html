</style></head><body><div id="map"></div><div class="map-notice">拖动浏览日本 · 双指/滚轮缩放 · 点击标记查看景点</div><script src="/static/vendor/leaflet/leaflet.js"></script><script>(function(){var q=new URLSearchParams(location.search),picking=q.get('pick')==='1',japanBounds=L.latLngBounds([24,122],[46.8,154.5]),map=L.map('map',{maxBounds:japanBounds,maxBoundsViscosity:1,minZoom:5,maxZoom:19,zoomControl:true}).setView(picking?[+(q.get('lat')||35.6812),+(q.get('lng')||139.7671)]:[36.2,138.3],picking?17:5);L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20,attribution:'&copy; OpenStreetMap contributors &copy; CARTO'}).addTo(map);if(picking){document.querySelector('.map-notice').textContent='拖动红色标记到建筑入口，松手即确认';var chosen=L.marker(map.getCenter(),{draggable:true}).addTo(map);function sendPoint(p){parent.postMessage({type:'tokyo-guide-location-picked',lat:p.lat,lng:p.lng},location.origin)}chosen.on('dragend',function(){sendPoint(chosen.getLatLng())});map.on('click',function(e){chosen.setLatLng(e.latlng);sendPoint(e.latlng)})}var spots=[];try{spots=JSON.parse(q.get('spots')||'[]')}catch(e){}var markerBounds=[],focus=q.get('focus'),focusMarker=null,icons={hotel:'宿',restaurant:'食',shopping:'购',transport:'站',attraction:'景',other:'点'};spots.forEach(function(spot){if(spot.lat===null||spot.lng===null||spot.lat===''||spot.lng===''||!isFinite(spot.lat)||!isFinite(spot.lng))return;var name=String(spot.name||'未命名景点'),firstChar=(spot.category==='attraction'||!spot.category)?(Array.from(name.trim())[0]||'景'):(icons[spot.category]||icons.other),type=spot.checked?'selected':(spot.category||((spot.isPreset===false)?'user':'')),icon=L.divIcon({className:'spot-marker',html:'<div class="spot-pin '+type+'"><span>'+escapeHtml(firstChar)+'</span></div>',iconSize:[36,36],iconAnchor:[18,36],popupAnchor:[0,-35]}),state=spot.checked?'已选景点':(spot.isPreset===false?'我的添加':'预设景点'),marker=L.marker([Number(spot.lat),Number(spot.lng)],{icon:icon}).addTo(ma
